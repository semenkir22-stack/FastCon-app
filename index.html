<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика FastCon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #23303f);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        h2 { color: var(--tg-theme-button-color, #388af6); }
        .count { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .desc { color: var(--tg-theme-hint-color, #8e99a5); font-size: 14px; }
    </style>
</head>
<body>
    <h2>FastCon VPN</h2>
    <div class="card">
        <div class="desc">Всего пользователей в сети</div>
        <div class="count" id="userCount">111 496</div>
    </div>
</body>
</html>
