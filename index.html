<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastCon Cyber Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #050509;
            --text-color: #ffffff;
            --neon-cyan: #00ffff;
            --neon-purple: #9400d3;
            --neon-pink: #ff0055;
            --card-bg: rgba(18, 18, 30, 0.7);
            --neon-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            --pink-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 16px;
        }

        /* Анимированный неоновый фон */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Контейнер контента поверх фона */
        #container {
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-color);
            text-shadow: var(--neon-shadow);
        }

        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        /* Карточки */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
        }

        /* Акцентная карточка (Триад) */
        .card-trial {
            border: 1.5px solid var(--neon-pink);
            box-shadow: var(--pink-shadow);
            text-align: center;
        }

        .trial-badge {
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-pink);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            border: 1px solid var(--neon-pink);
        }

        .trial-time {
            font-size: 34px;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: var(--pink-shadow);
            margin-bottom: 8px;
        }

        .trial-desc {
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 22px;
        }

        .cyber-btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(255, 0, 85, 0.6));
            border: 1.5px solid var(--neon-pink);
            color: var(--text-color);
            padding: 16px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .cyber-btn:active {
            transform: scale(0.98);
        }

        /* Статистика пользователей */
        .stats-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
        }

        .stats-label {
            font-size: 11px;
            color: var(--neon-purple);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stats-number {
            font-size: 28px;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: var(--neon-shadow);
            letter-spacing: 0.5px;
        }

        /* Информационные пункты */
        .info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3.5px solid var(--neon-cyan);
        }

        .info-item-title {
            font-size: 13px;
            font-weight: 600;
        }

        .info-item-val {
            font-size: 13px;
            color: var(--neon-cyan);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="container">
        <div class="header">
            <h1 class="title">FastCon</h1>
            <p class="subtitle">Secure Cyber Space</p>
        </div>

        <div class="card card-trial">
            <div class="trial-badge">★ Cyber Trial ★</div>
            <div class="trial-time">3 ДНЯ БЕСПЛАТНО</div>
            <div class="trial-desc">
                Получите полный доступ к сети без ограничений скорости и блокировок
            </div>
            <button class="cyber-btn" onclick="openTrial()">Активировать</button>
        </div>

        <div class="card">
            <div class="stats-box">
                <div class="stats-label">Пользователей онлайн</div>
                <div class="stats-number" id="statsCount">111 496+</div>
            </div>
        </div>

        <div class="info-list">
            <div class="info-item">
                <div class="info-item-title">Состояние узла</div>
                <div class="info-item-val">ACTIVE</div>
            </div>
            <div class="info-item" style="border-left-color: var(--neon-purple);">
                <div class="info-item-title">Протокол</div>
                <div class="info-item-val">V2RAY / VMESS</div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#050509');
        tg.backgroundColor = '#050509';

        // Анимация фона (абстрактные цифровые точки / звёзды)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.color = Math.random() > 0.5 ? '#00ffff' : '#ff0055';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particlesArray.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = '#050509';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Действие кнопки
        function openTrial() {
            tg.openTelegramLink('https://t.me/obhod_mobilniy_bot?start=ref_7650109118');
        }
    </script>
</body>
</html>
