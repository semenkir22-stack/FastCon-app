<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCon VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-text-color: #f5f5f5;
            --tg-theme-hint-color: #8e99a5;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title {
            color: var(--tg-theme-hint-color, #8e99a5);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        .description {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
            max-width: 360px;
        }

        .tg-button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .tg-button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="card">
            <div class="card-title">👥 Этим VPN уже пользуются</div>
            <div class="card-value">больше 100 000 человек</div>
        </div>

        <div class="description">
            Заберите свой бесплатный пробный период, чтобы получить быстрый и стабильный доступ в интернет.
        </div>

        <button class="tg-button" onclick="redirectToBot()">Подключить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Разворачиваем приложение на весь экран
        tg.expand();
        // Красим верхний бар в цвет фона
        tg.setHeaderColor('bg_color');

        function redirectToBot() {
            // Переход по вашей ссылке
            tg.openTelegramLink('https://t.me/obhod_mobilniy_bot?start=ref_7650109118');
        }
    </script>
</body>
</html>
