<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastCon VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #050509;
            --text-color: #ffffff;
            --neon-cyan: #0ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff0055;
            --card-bg: rgba(20, 20, 35, 0.6);
            --shadow-neon: 0 0 10px rgba(15, 255, 255, 0.7), 0 0 20px rgba(15, 255, 255, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Задний фон */
        #background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            opacity: 0.15;
        }

        .flying-logo {
            position: absolute;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.4);
            user-select: none;
            pointer-events: none;
            animation: fly linear infinite;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(20px); opacity: 0; }
        }

        #app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        /* Логотип */
        .logo-container {
            text-align: center;
            margin-bottom: 5px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .logo-subtext {
            font-size: 13px;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Карточки */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(15, 255, 255, 0.2);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .trial-card {
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            text-align: center;
        }

        .trial-title {
            color: var(--neon-pink);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .trial-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .trial-button {
            background: none;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            border-radius: 40px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
        }

        .trial-button:hover {
            background-color: var(--neon-pink);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        }

        .stats-card {
            text-align: center;
            border: 1px solid rgba(188, 19, 254, 0.3);
        }

        .stats-title {
            color: var(--neon-purple);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stats-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--shadow-neon);
        }
    </style>
</head>
<body>

    <div id="background-container"></div>

    <div id="app-container">
        
        <div class="logo-container">
            <div class="logo-text">FastCon VPN</div>
            <div class="logo-subtext">Безопасный доступ в интернет</div>
        </div>

        <div class="card trial-card">
            <div class="trial-title">⚡ Пробный период ⚡</div>
            <div class="trial-value">3 ДНЯ БЕСПЛАТНО</div>
            <div style="font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 20px;">
                Получите неограниченный доступ к сети без ограничений скорости прямо сейчас
            </div>
            <button class="trial-button" onclick="startTrial()">Активировать тест</button>
        </div>

        <div class="card stats-card">
            <div class="stats-title">Пользователей в сети</div>
            <div class="stats-value">111 496+</div>
            <div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px;">
                человек уже используют FastCon
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#050509');
        tg.backgroundColor = '#050509';

        // Фон
        const bgContainer = document.getElementById('background-container');
        const logos = ['📸', '👥', '🐦', '🎬', '📲', '🎯'];

        function createLogo() {
            const logo = document.createElement('div');
            logo.classList.add('flying-logo');
            logo.innerText = logos[Math.floor(Math.random() * logos.length)];
            logo.style.left = Math.random() * 100 + 'vw';
            logo.style.animationDuration = Math.random() * 10 + 15 + 's';
            logo.style.fontSize = Math.random() * 20 + 30 + 'px';
            bgContainer.appendChild(logo);
            setTimeout(() => { logo.remove(); }, 25000);
        }

        setInterval(createLogo, 1500);
        for(let i=0; i<10; i++) { setTimeout(createLogo, i * 500); }

        function startTrial() {
            // Переход обратно в бота или отправка данных
            tg.openTelegramLink('https://t.me/obhod_mobilniy_bot?start=ref_7650109118');
        }
    </script>
</body>
</html>
