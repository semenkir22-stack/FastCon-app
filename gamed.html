<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCon: Cyber-Bypass 2026</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff9f;
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            border: 2px solid var(--neon-blue);
        }

        canvas {
            display: block;
            background: #000;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,243,255,0.1), transparent);
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.7);
            border-left: 4px solid var(--neon-blue);
            padding: 10px 15px;
            backdrop-filter: blur(5px);
        }

        .label { font-size: 10px; color: var(--neon-blue); margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: bold; text-shadow: 0 0 10px var(--neon-blue); }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            border: 2px solid var(--neon-pink);
            display: none;
        }

        h2 { color: var(--neon-pink); font-size: 40px; margin: 0; text-shadow: 0 0 20px var(--neon-pink); }
        
        .btn {
            margin-top: 20px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            cursor: pointer;
            font-size: 18px;
            font-family: inherit;
            transition: 0.3s;
            pointer-events: all;
        }

        .btn:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 30px var(--neon-green);
        }

        .glitch-text {
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <div class="ui-layer">
            <div class="stat-box">
                <div class="label">Traffic Restored</div>
                <div id="score" class="value">0.00 GB</div>
            </div>
            <div class="stat-box" style="border-color: var(--neon-pink);">
                <div class="label">Signal Integrity</div>
                <div id="health" class="value">100%</div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="overlay">
            <h2 class="glitch-text">CONNECTION TERMINATED</h2>
            <p id="final-stats" style="color: #888; margin: 20px 0;"></p>
            <button class="btn" onclick="init()">RE-ESTABLISH VLESS</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');
    const overlay = document.getElementById('overlay');
    const finalStats = document.getElementById('finalStats');

    canvas.width = 500;
    canvas.height = 700;

    let gameActive, score, health, player, particles, enemies, items, frames, stars;

    class Player {
        constructor() {
            this.width = 40;
            this.height = 40;
            this.x = canvas.width / 2 - 20;
            this.y = canvas.height - 100;
            this.targetX = this.x;
            this.speed = 0.15; // Сглаживание движения
            this.realityActive = 0; // Время действия Reality протокола
        }

        draw() {
            ctx.save();
            // Свечение игрока
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.realityActive > 0 ? '#00ff9f' : '#00f3ff';
            
            // Тело FastCon
            ctx.fillStyle = this.realityActive > 0 ? '#00ff9f' : '#00f3ff';
            ctx.fillRect(this.x, this.y, this.width, this.height);
            
            // Внутренний декор
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(this.x + 5, this.y + 5, this.width - 10, this.height - 10);
            
            ctx.restore();
        }

        update() {
            this.x += (this.targetX - this.x) * this.speed;
            if (this.realityActive > 0) this.realityActive--;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 4 - 2;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.02;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    function spawnEnemy() {
        const types = [
            { name: 'DPI', color: '#ff0055', w: 60, h: 20, speed: 4 },
            { name: 'IP-BAN', color: '#8a00ff', w: 30, h: 30, speed: 6 },
            { name: 'RKN-WALL', color: '#ff0055', w: 120, h: 15, speed: 3 }
        ];
        if (frames % Math.max(10, 40 - Math.floor(score/5)) === 0) {
            let type = types[Math.floor(Math.random() * types.length)];
            enemies.push({
                ...type,
                x: Math.random() * (canvas.width - type.w),
                y: -50
            });
        }
    }

    function spawnItem() {
        if (frames % 60 === 0) {
            const isPowerup = Math.random() > 0.9;
            items.push({
                x: Math.random() * (canvas.width - 20),
                y: -30,
                size: 15,
                speed: 3,
                type: isPowerup ? 'REALITY' : 'DATA',
                color: isPowerup ? '#00ff9f' : '#fff'
            });
        }
    }

    function init() {
        gameActive = true;
        score = 0;
        health = 100;
        frames = 0;
        player = new Player();
        particles = [];
        enemies = [];
        items = [];
        stars = Array.from({length: 50}, () => ({
            x: Math.random() * canvas.width, 
            y: Math.random() * canvas.height, 
            s: Math.random() * 2
        }));
        
        overlay.style.display = 'none';
        scoreEl.innerText = "0.00 GB";
        healthEl.innerText = "100%";
        animate();
    }

    function drawStars() {
        ctx.fillStyle = '#111';
        stars.forEach(s => {
            ctx.fillRect(s.x, s.y, s.s, s.s);
            s.y += (s.s + 1);
            if (s.y > canvas.height) s.y = -10;
        });
    }

    function animate() {
        if (!gameActive) return;
        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Эффект хвоста (motion blur)
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawStars();
        frames++;

        player.update();
        player.draw();

        // Частицы за игроком (инверсионный след)
        if (frames % 2 === 0) {
            particles.push(new Particle(player.x + player.width/2, player.y + player.height, '#00f3ff'));
        }

        // Обновление врагов
        enemies.forEach((en, i) => {
            en.y += en.speed;
            ctx.shadowBlur = 10;
            ctx.shadowColor = en.color;
            ctx.fillStyle = en.color;
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#fff';
            ctx.font = '10px Orbitron';
            ctx.fillText(en.name, en.x + 5, en.y + 15);

            // Коллизия с игроком
            if (player.realityActive <= 0 &&
                player.x < en.x + en.w && player.x + player.width > en.x &&
                player.y < en.y + en.h && player.y + player.height > en.y) {
                
                health -= 20;
                enemies.splice(i, 1);
                healthEl.innerText = health + "%";
                for(let j=0; j<10; j++) particles.push(new Particle(player.x, player.y, '#ff0055'));
                
                if (health <= 0) {
                    gameActive = false;
                    overlay.style.display = 'flex';
                    document.getElementById('final-stats').innerText = `SAVED DATA: ${(score * 0.12).toFixed(2)} GB`;
                }
            }
            if (en.y > canvas.height) enemies.splice(i, 1);
        });

        // Обновление предметов
        items.forEach((it, i) => {
            it.y += it.speed;
            ctx.shadowBlur = 15;
            ctx.shadowColor = it.color;
            ctx.fillStyle = it.color;
            ctx.beginPath();
            ctx.arc(it.x + 7, it.y + 7, it.size/2, 0, Math.PI*2);
            ctx.fill();

            if (player.x < it.x + it.size && player.x + player.width > it.x &&
                player.y < it.y + it.size && player.y + player.height > it.y) {
                
                if (it.type === 'REALITY') {
                    player.realityActive = 300; // 5 секунд неуязвимости
                } else {
                    score++;
                    scoreEl.innerText = (score * 0.12).toFixed(2) + " GB";
                }
                items.splice(i, 1);
                for(let j=0; j<8; j++) particles.push(new Particle(it.x, it.y, it.color));
            }
            if (it.y > canvas.height) items.splice(i, 1);
        });

        // Частицы
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        spawnEnemy();
        spawnItem();
        requestAnimationFrame(animate);
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.clientX - rect.left - player.width / 2;
    });

    // Для мобилок
    canvas.addEventListener('touchmove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.touches[0].clientX - rect.left - player.width / 2;
        e.preventDefault();
    }, {passive: false});

    init();
</script>
</body>
</html>
