<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN FastCon: Без блок зон</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: #66fcf1;
            margin: 0;
            text-shadow: 0 0 10px #45a29e;
            text-transform: uppercase;
        }

        p { margin: 5px 0 0 0; font-size: 14px; }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background-color: #1f2833;
            border: 2px solid #45a29e;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            color: #66fcf1;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 12, 16, 0.9);
            padding: 30px;
            border: 2px solid #66fcf1;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 30px #45a29e;
        }

        #game-over h2 { margin-top: 0; color: #ff003c; }

        button {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #66fcf1;
        }

        .controls-info {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>VPN FastCon</h1>
        <p>Прорывайся сквозь блокировки!</p>
    </div>

    <div id="game-container">
        <div id="ui">
            <span>Score: <span id="score">0</span></span>
            <span id="status" style="color: #00ffaa; display: none;">NO-BLOCK АКТИВЕН!</span>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="game-over">
            <h2>СОЕДИНЕНИЕ СБРОШЕНО</h2>
            <p>Ты наткнулся на фаервол.</p>
            <p>Пройдено серверов: <span id="final-score" style="color: #66fcf1; font-weight: bold;">0</span></p>
            <button onclick="restartGame()">Переподключиться</button>
        </div>
    </div>

    <div class="controls-info">
        Управление: <b>Стрелки Влево/Вправо</b> или <b>A/D</b>. Зеленые сферы дают неуязвимость.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const statusEl = document.getElementById('status');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        let animationId;
        let score = 0;
        let gameSpeed = 4;
        let isGameOver = false;
        let frames = 0;

        // Главный герой (Пакет VPN)
        const player = {
            x: 200,
            y: 520,
            radius: 12,
            color: '#66fcf1',
            speed: 6,
            dx: 0,
            invulnerable: false,
            invulnTimer: 0
        };

        let obstacles = [];
        let powerups = []; // Ноблок зоны

        // Управление клавиатурой
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') player.dx = -player.speed;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') player.dx = player.speed;
        });

        document.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'a', 'ф', 'ArrowRight', 'd', 'в'].includes(e.key)) {
                player.dx = 0;
            }
        });

        function spawnObstacle() {
            // Создаем блокировки (красные стены) с окном для прохода
            const width = Math.random() * (250 - 80) + 80;
            const x = Math.random() * (canvas.width - width);
            obstacles.push({ x: x, y: -20, width: width, height: 20, color: '#ff003c' });
        }

        function spawnPowerup() {
            // Зеленый токен для "Без блок зон"
            const x = Math.random() * (canvas.width - 40) + 20;
            powerups.push({ x: x, y: -20, radius: 10, color: '#00ffaa' });
        }

        function drawPlayer() {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.invulnerable ? '#ffffff' : player.color;
            ctx.shadowBlur = player.invulnerable ? 25 : 15;
            ctx.shadowColor = player.invulnerable ? '#ffffff' : player.color;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function update() {
            if (isGameOver) return;
            animationId = requestAnimationFrame(update);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Движение игрока
            player.x += player.dx;
            if (player.x - player.radius < 0) player.x = player.radius;
            if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;

            drawPlayer();

            // Таймер неуязвимости
            if (player.invulnerable) {
                player.invulnTimer--;
                statusEl.style.display = 'inline';
                if (player.invulnTimer <= 0) {
                    player.invulnerable = false;
                    statusEl.style.display = 'none';
                }
            }

            frames++;
            // Ускорение генерации препятствий со временем
            let obstacleRate = Math.max(40, 90 - Math.floor(score / 5));
            if (frames % obstacleRate === 0) spawnObstacle();
            
            // Ноблок зоны появляются реже
            if (frames % 400 === 0) spawnPowerup();

            // Обновление препятствий
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;

                // Проверка столкновений
                if (!player.invulnerable &&
                    player.x + player.radius > obs.x &&
                    player.x - player.radius < obs.x + obs.width &&
                    player.y + player.radius > obs.y &&
                    player.y - player.radius < obs.y + obs.height) {
                    endGame();
                }

                // Очистка памяти и очки
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    i--;
                    score++;
                    scoreEl.innerText = score;
                    if (score % 15 === 0) gameSpeed += 0.5; // Увеличиваем скорость каждые 15 очков
                }
            }

            // Обновление бонусов (Ноблок зоны)
            for (let i = 0; i < powerups.length; i++) {
                let p = powerups[i];
                p.y += gameSpeed;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                // Сбор бонуса
                const dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist - player.radius - p.radius < 1) {
                    player.invulnerable = true;
                    player.invulnTimer = 180; // 3 секунды при 60 FPS
                    powerups.splice(i, 1);
                    i--;
                } else if (p.y > canvas.height) {
                    powerups.splice(i, 1);
                    i--;
                }
            }
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'block';
        }

        function restartGame() {
            score = 0;
            gameSpeed = 4;
            frames = 0;
            obstacles = [];
            powerups = [];
            isGameOver = false;
            player.x = 200;
            player.invulnerable = false;
            statusEl.style.display = 'none';
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            update();
        }

        // Старт игры
        update();
    </script>
</body>
</html>
