<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FastCon VPN — Обход Блокировок</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--c:#00f3ff;--m:#ff00ff;--g:#39ff14;--y:#fff01f;--bg:#0a0b10}
body{background:var(--bg);color:#e0e6ed;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100dvh;width:100vw;position:relative}
canvas#bg{position:fixed;inset:0;z-index:0;opacity:.4}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;transform:scale(.93)}
.screen.on{opacity:1;pointer-events:all;transform:scale(1)}
.card{background:rgba(15,16,22,.88);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-height:90dvh;overflow-y:auto}
.card::-webkit-scrollbar{width:4px}
.card::-webkit-scrollbar-thumb{background:var(--c);border-radius:4px}
h1{font-size:1.8rem;text-align:center;background:linear-gradient(90deg,var(--c),var(--m),var(--g));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 4s ease infinite;text-shadow:0 0 8px rgba(0,243,255,.4);margin-bottom:12px}
h2{font-size:1.4rem;text-align:center;color:var(--c);text-shadow:0 0 12px var(--c);margin-bottom:12px}
p,li{font-size:.92rem;line-height:1.6;color:#8b92a1;margin-bottom:10px}
.step-list{list-style:none;padding:0}
.step-list li{padding:10px 12px;margin-bottom:8px;background:rgba(0,243,255,.04);border-left:3px solid var(--c);border-radius:0 8px 8px 0;font-size:.88rem}
.btn{display:flex;align-items:center;justify-content:center;padding:14px 24px;margin-top:18px;font-size:1rem;font-weight:700;color:#000;background:linear-gradient(135deg,var(--c),var(--m));border:none;border-radius:12px;cursor:pointer;width:100%;max-width:300px;position:relative;overflow:hidden;transition:all .3s;box-shadow:0 0 15px var(--c);text-decoration:none;text-align:center}
.btn::after{content:'';position:absolute;inset:-2px;background:linear-gradient(45deg,var(--c),var(--m),var(--g),var(--c));background-size:400%;z-index:-1;border-radius:14px;animation:borderGlow 3s linear infinite;opacity:.6}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 30px var(--m)}
.btn:active{transform:scale(.97)}
@keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes borderGlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes scanline{0%{top:-100%}100%{top:100%}}
@keyframes blockPulse{0%,100%{box-shadow:0 0 5px rgba(255,0,0,.3)}50%{box-shadow:0 0 20px rgba(255,0,0,.6)}}
@keyframes vpnGlow{0%,100%{box-shadow:0 0 5px rgba(57,255,20,.4)}50%{box-shadow:0 0 25px rgba(57,255,20,.7)}}
@keyframes countPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.icon{font-size:2.2rem;text-align:center;margin:8px 0}
.stat-box{display:flex;justify-content:space-around;margin:12px 0;flex-wrap:wrap;gap:8px}
.stat{flex:1;min-width:80px;text-align:center}
.stat .num{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--c),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .lbl{font-size:.7rem;color:#555;margin-top:2px}
@media(max-height:700px){.card{max-height:95dvh;padding:16px}h1{font-size:1.5rem}p,li{font-size:.84rem;margin-bottom:6px}.stat .num{font-size:1.2rem}}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="screen on" id="sStart">
<div class="card">
  <h1>🌐 FastCon VPN</h1>
  <p style="text-align:center;color:var(--c)">Симулятор обхода блокировок</p>
  <div class="icon">📱</div>
  <p style="text-align:center; font-weight:bold; color:var(--g)">🎁 В конце вас ждет подарок!</p>
  <ul class="step-list">
    <li>🚫 <strong>РКН</strong> начнёт блокировать приложения</li>
    <li>📶 Включай <strong>FastCon VPN</strong> для каждого</li>
    <li>⚡ Успей нажать, пока таймер не истёк!</li>
    <li>🏆 Обойди все <strong>10 блокировок</strong></li>
  </ul>
  <div class="stat-box">
    <div class="stat"><div class="num" id="statMax">10</div><div class="lbl">Блокировок</div></div>
    <div class="stat"><div class="num" id="statTime">5с</div><div class="lbl">Время</div></div>
  </div>
  <button class="btn" id="btnStart" onclick="location.href='gamed.html'">▶ Начать</button>
</div>
</div>

<script>
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  let lines = [];
  
  function initMatrix() {
    lines = Array(Math.floor(canvas.width / 20)).fill(0);
  }
  initMatrix();

  function draw() {
    ctx.fillStyle = 'rgba(10, 11, 16, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f3ff';
    ctx.font = '14px monospace';
    lines.forEach((y, x) => {
      ctx.fillText(String.fromCharCode(33 + Math.random() * 93), x * 20, y);
      if (y > canvas.height && Math.random() > 0.975) {
        lines[x] = 0;
      } else {
        lines[x] = y + 15;
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
  
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initMatrix();
  });
</script>
</body>
