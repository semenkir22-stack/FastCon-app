<!DOCTYPE html>
<html lang="ru" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Breaker Terminal // FastCon</title>
    <style>
        /* --- Global Styling --- */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: #020c1e; /* Deep dark blue/black */
            color: #00ffcc; /* Neon Cyan */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        #game-container {
            background-color: rgba(10, 20, 40, 0.8); /* Semi-transparent dark panel */
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc, inset 0 0 10px #00ffcc;
            padding: 40px;
            width: 90%;
            max-width: 800px;
            box-sizing: border-box;
            animation: glow 1.5s infinite alternate; /* Subtle glow animation */
        }

        /* --- Text & Simulation Area --- */
        #console-output {
            min-height: 200px;
            padding: 20px;
            background-color: #020c1e;
            border: 1px solid #008080;
            margin-bottom: 20px;
            overflow-y: auto;
            white-space: pre-wrap; /* Maintains formatting */
            font-size: 1rem;
            line-height: 1.6;
            opacity: 0; /* Starts hidden for animation */
            animation: fadeIn 2s forwards;
        }

        /* --- Neon Button Styling --- */
        button {
            background: none;
            border: 2px solid;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 5px #00ffcc;
            color: #00ffcc;
            outline: none;
        }

        button:hover:not(:disabled) {
            background-color: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
            transform: translateY(-3px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- Animation Keyframes --- */
        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 204, 0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* --- Special Class for Alerts/Results --- */
        .block {
            color: #ff4757; /* Red neon */
            text-shadow: 0 0 5px #ff4757;
        }

        .success {
            color: #00ffcc; /* Cyan neon */
            text-shadow: 0 0 5px #00ffcc;
        }

        .alert {
            color: #ffcc00; /* Yellow neon */
            text-shadow: 0 0 5px #ffcc00;
            animation: blink 1s step-end infinite;
        }

        /* --- Final CTA Button --- */
        #cta-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            font-size: 1.2rem;
            background-color: #ff00ff; /* Magenta contrast */
            border-color: #ff00ff;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 0 20px #ff00ff;
        }
        #cta-button:hover {
             background-color: #ff00ff;
             box-shadow: 0 0 30px #ff00ff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>:: VIRTUAL CONNECTION TERMINAL ::</h1>
        <p>🔐 Статус: Ограниченный доступ. Симуляция обхода сетевой блокировки.</p>

        <!-- Область вывода текста -->
        <div id="console-output">
            // Инициализация протокола. Ожидание ввода...
        </div>

        <!-- Кнопки действий -->
        <div id="controls">
            <button id="start-btn" onclick="startSimulation()">ПОПРОБОВАТЬ ПОДКЛЮЧЕНИЕ</button>
        </div>

        <!-- Блок с финальным призывом к действию (скрыт по умолчанию) -->
        <a id="cta-button" href="https://t.me/obhod_mobilniy_bot?start=ref_7650109118" target="_blank" style="display: none;">
            🟢 ПОБЕДА! АКТИВИРОВАТЬ ПРОБНЫЙ ПЕРИОД
        </a>
    </div>

    <script>
        const consoleOutput = document.getElementById('console-output');
        const controlsDiv = document.getElementById('controls');
        const startBtn = document.getElementById('start-btn');
        const ctaButton = document.getElementById('cta-button');

        let gamePhase = 0;

        // Функция имитации ввода текста
        function appendText(text, className = '') {
            const p = document.createElement('p');
            p.innerHTML = text;
            if (className) {
                p.className = className;
            }
            consoleOutput.appendChild(p);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Управление кнопками
        function setControls(buttonsHTML) {
            controlsDiv.innerHTML = buttonsHTML;
        }

        // -------------------------------------------------------
        // --- Логика Игры ---
        // -------------------------------------------------------

        // Начало симуляции
        function startSimulation() {
            if (gamePhase > 0) return;

            // Очистка и сброс
            consoleOutput.innerHTML = '';
            gamePhase = 1;

            appendText(">> ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ. ПОДКЛЮЧЕНИЕ К СЕТИ...", '');
            setTimeout(() => {
                appendText("\n[!] ПРЕДУПРЕЖДЕНИЕ: Обнаружен повышенный уровень сетевой фильтрации (РКН).", 'alert');
                setTimeout(() => {
                    appendText(">>> Целевые сервисы, подлежащие блокировке: YouTube, Instagram, VPN-протоколы и т.д.", 'block');
                    setControls(
                        `<button onclick="attemptConnection('youtube')">Попытаться зайти на YouTube</button>
                         <button onclick="attemptConnection('insta')">Попытаться зайти в Instagram</button>
                         <button onclick="attemptConnection('vpn')">Попробовать стандартный VPN</button>`
                    );
                }, 1500);
            }, 1000);
        }

        // Попытка подключения (Основной игровой цикл)
        function attemptConnection(service) {
            if (gamePhase !== 1) return;

            const message = `Вы пытаетесь подключиться к сервису: ${service.toUpperCase()}...`;
            appendText(message, '');

            // Имитация задержки и ошибки
            setTimeout(() => {
                if (service === 'youtube' || service === 'insta' || service === 'vpn') {
                    appendText(`\n[ERROR 403] Блокировка успешно применена. Контент недоступен. Сервис перехвачен на уровне DPI.`, 'block');
                    
                    setTimeout(() => {
                        // Успех, ввод FastCon
                        appendText("\n[!!!] ОШИБКА СЕТИ ПРЕВЫШЕНА. Обнаружен протокол FastCon. Активировано обходное ядро...", 'success');
                        setControls(`
                            <button onclick="bypass('fastcon')">ПРИМЕНИТЬ ОБХОД FASTCON</button>
                        `);
                    }, 2000);

                } else {
                    appendText(`\n[INFO] Сервис ${service.toUpperCase()} доступен. (Симуляция провала)`);
                }
            }, 1500);
        }

        // Функция обхода (Победа)
        function bypass(vpnName) {
            if (gamePhase !== 2) return;

            appendText(`\n[CORE_EXEC] Инициирование обхода через протокол ${vpnName}.... Проверка каналов... ОК.`, 'success');
            
            setTimeout(() => {
                appendText(`\n[SUCCESS] !!! СОЕДИНЕНИЕ УСТАНОВЛЕНО. БЛОКИРОВКА ПРЕОДОЛЕНА. ВСЕ СЕРВИСЫ ДОСТУПНЫ.`, 'success');
                
                // Финальная фаза
                gamePhase = 3;
                setControls(`
                    <button onclick="showVictory()">ПОДТВЕРДИТЬ ПОБЕДУ</button>
                `);
            }, 2500);
        }
        
        // Показ победного экрана и CTA
        function showVictory() {
             if (gamePhase !== 3) return;

            consoleOutput.innerHTML += `\n\n=================================================\n`;
            consoleOutput.innerHTML += `\n[=== WIN STATE ===]\n`;
            consoleOutput.innerHTML += `\n[+] поздравляю с победой! Вы восстановили полный интернет доступ!`;
            consoleOutput.innerHTML += `\n[!] Наслаждайтесь этим!`;
            consoleOutput.innerHTML += `\n[!] Не платите за доступ к стабильности.`;
            consoleOutput.innerHTML += `\n[!!!] Забирайте свой пробный период, чтобы навсегда забыть о блокировках!`;
            consoleOutput.innerHTML += `\n=================================================\n`;
            
            setControls(""); // Удаляем кнопку "Подтвердить"
            ctaButton.style.display = 'block'; // Показываем финальную кнопку
        }

        // Инициализация при загрузке
        window.onload = function() {
            // Убираем первую начальную заглушку
            consoleOutput.innerHTML = `// Инициализация протокола. Ожидание ввода...`;
        }
    </script>

</body>
</html>
